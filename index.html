<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gmail</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 350; font-size: 22px; }
    .fill-icon { font-variation-settings: 'FILL' 1; }
    
    .avatar-ring {
      background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570, #1ba0e2);
      padding: 1.5px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-[#f6f8fc] h-screen flex flex-col text-[#1f1f1f] overflow-hidden select-none">

  <!-- TOP MOBILE SEARCH CAPSULE -->
  <div class="pt-3 px-3 pb-2 shrink-0">
    <div class="bg-white shadow-[0_1px_3px_0_rgba(60,64,67,0.3),0_4px_8px_3px_rgba(60,64,67,0.15)] rounded-full h-12 flex items-center px-3 gap-3">
      <button onclick="toggleDrawer(true)" class="p-1 text-gray-700 active:bg-gray-100 rounded-full">
        <span class="material-symbols-outlined">menu</span>
      </button>
      
      <input 
        id="searchInput" 
        oninput="handleSearch()" 
        type="text" 
        placeholder="Search in mail" 
        class="flex-1 bg-transparent outline-none text-sm text-gray-800 placeholder-gray-500" 
      />

      <div class="avatar-ring cursor-pointer" onclick="alert('Account: user@gmail.com')">
        <div class="w-7 h-7 rounded-full bg-[#c2185b] border border-white text-white flex items-center justify-center font-bold text-xs">
          A
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION BANNER -->
  <div class="px-4 py-1.5 flex items-center justify-between text-xs text-gray-500 font-semibold uppercase tracking-wider shrink-0">
    <span id="folderTitleDisplay">Inbox</span>
    <span id="mailCountBadge">0</span>
  </div>

  <!-- EMAIL LIST CONTAINER -->
  <main id="emailListView" class="flex-1 overflow-y-auto divide-y divide-gray-100 bg-white shadow-inner"></main>

  <!-- EMPTY STATE -->
  <div id="emptyView" class="hidden flex-1 flex flex-col items-center justify-center text-gray-400 bg-white">
    <span class="material-symbols-outlined !text-6xl text-gray-300 mb-2">inbox</span>
    <p class="text-sm font-medium">No messages here</p>
  </div>

  <!-- MOBILE BOTTOM BAR -->
  <nav class="h-14 bg-[#f2f6fc] border-t border-gray-200 flex items-center justify-around shrink-0 text-gray-600">
    <button onclick="switchFolder('inbox')" class="flex flex-col items-center justify-center text-[#0b57d0] font-semibold text-xs gap-0.5 w-16">
      <span class="material-symbols-outlined fill-icon !text-24px">mail</span>
      <span>Mail</span>
    </button>
    <button onclick="alert('Meet video calls integration')" class="flex flex-col items-center justify-center text-gray-600 text-xs gap-0.5 w-16">
      <span class="material-symbols-outlined !text-24px">videocam</span>
      <span>Meet</span>
    </button>
  </nav>

  <!-- FAB COMPOSE BUTTON -->
  <button 
    onclick="openComposeModal()" 
    class="fixed bottom-20 right-4 bg-[#c2e7ff] text-[#001d35] px-4 py-3 rounded-2xl flex items-center gap-2 shadow-[0_4px_8px_3px_rgba(60,64,67,0.15)] active:scale-95 transition-transform z-30 font-medium text-sm">
    <span class="material-symbols-outlined !text-20px">edit</span>
    <span>Compose</span>
  </button>

  <!-- SLIDE-OVER NAVIGATION DRAWER -->
  <div id="drawerOverlay" onclick="toggleDrawer(false)" class="hidden fixed inset-0 bg-black/50 z-40 transition-opacity"></div>
  <aside id="drawer" class="fixed top-0 bottom-0 left-0 w-72 bg-white z-50 transform -translate-x-full transition-transform duration-250 ease-in-out flex flex-col shadow-2xl">
    <div class="h-16 flex items-center px-5 border-b border-gray-100">
      <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r5.png" class="h-6 object-contain" alt="Gmail" />
    </div>

    <nav class="flex-1 overflow-y-auto p-2 space-y-1 text-sm font-medium text-gray-700">
      <div onclick="switchFolderFromDrawer('inbox')" id="drawer-inbox" class="flex items-center justify-between px-4 py-3 rounded-full bg-[#d3e3fd] text-[#001d35] font-bold cursor-pointer">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined fill-icon">inbox</span>
          <span>Inbox</span>
        </div>
        <span id="drawerUnread" class="text-xs bg-blue-200 px-2 py-0.5 rounded-full text-blue-900 font-bold">0</span>
      </div>
      <div onclick="switchFolderFromDrawer('starred')" id="drawer-starred" class="flex items-center justify-between px-4 py-3 rounded-full hover:bg-gray-100 cursor-pointer">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined">star</span>
          <span>Starred</span>
        </div>
        <span id="drawerStarred" class="text-xs text-gray-500 font-semibold"></span>
      </div>
      <div onclick="switchFolderFromDrawer('sent')" id="drawer-sent" class="flex items-center justify-between px-4 py-3 rounded-full hover:bg-gray-100 cursor-pointer">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined">send</span>
          <span>Sent</span>
        </div>
      </div>
      <div onclick="switchFolderFromDrawer('trash')" id="drawer-trash" class="flex items-center justify-between px-4 py-3 rounded-full hover:bg-gray-100 cursor-pointer">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined">delete</span>
          <span>Trash</span>
        </div>
      </div>

      <div class="pt-4 border-t border-gray-100 px-4">
        <button onclick="regenerateAprilDataset()" class="w-full text-xs bg-gray-100 border border-gray-300 py-2 rounded-lg text-gray-700 font-medium">
          Reset 200 Mails (With Logos & Signatures)
        </button>
      </div>
    </nav>

    <div class="p-4 border-t border-gray-100 text-xs text-gray-500">
      <div class="w-full bg-gray-200 h-1 rounded-full mb-1.5 overflow-hidden">
        <div class="bg-blue-600 h-full w-1/3"></div>
      </div>
      <span>4.6 GB of 15 GB used</span>
    </div>
  </aside>

  <!-- MOBILE EMAIL DETAIL FULL-SCREEN VIEW -->
  <div id="emailDetailView" class="hidden fixed inset-0 bg-white z-50 flex flex-col">
    <div class="h-14 flex items-center justify-between px-3 border-b border-gray-100">
      <button onclick="closeDetailView()" class="p-2 text-gray-700">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div class="flex items-center gap-2 text-gray-600">
        <button onclick="deleteActiveEmail()" class="p-2"><span class="material-symbols-outlined">delete</span></button>
        <button onclick="toggleActiveStar()" class="p-2"><span id="detailStarIcon" class="material-symbols-outlined">star</span></button>
        <button class="p-2"><span class="material-symbols-outlined">more_vert</span></button>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <h1 id="detailSubject" class="text-xl font-medium text-gray-900 leading-snug"></h1>
      
      <div class="flex items-start gap-3">
        <div id="detailAvatarWrapper" class="shrink-0"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline justify-between">
            <span id="detailSender" class="font-bold text-sm text-gray-900 truncate"></span>
            <span id="detailDate" class="text-xs text-gray-500 whitespace-nowrap"></span>
          </div>
          <div id="detailEmail" class="text-xs text-gray-500 truncate"></div>
        </div>
      </div>

      <!-- Main Body Text -->
      <div id="detailBody" class="text-sm text-gray-800 leading-relaxed whitespace-pre-line border-t border-gray-100 pt-4"></div>

      <!-- Sender Custom Inline/Signature Image -->
      <div id="detailSignatureContainer" class="hidden pt-3">
        <img id="detailSignatureImage" class="max-h-24 object-contain rounded border border-gray-200 p-1 bg-white shadow-xs" alt="Signature Logo" />
      </div>

      <!-- Attachment Cards Section -->
      <div id="detailAttachmentsContainer" class="hidden pt-4 border-t border-gray-100">
        <div class="text-xs font-semibold text-gray-500 mb-2 flex items-center gap-1">
          <span class="material-symbols-outlined !text-16px">attachment</span>
          <span id="attachmentHeadingCount">Attachments</span>
        </div>
        <div id="detailAttachmentsList" class="flex flex-col gap-2"></div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="h-14 border-t border-gray-200 px-4 flex items-center gap-3 bg-gray-50">
      <button class="flex-1 py-2 border border-gray-300 bg-white rounded-full text-xs font-semibold text-gray-700 flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined !text-16px">reply</span>
        <span>Reply</span>
      </button>
      <button class="flex-1 py-2 border border-gray-300 bg-white rounded-full text-xs font-semibold text-gray-700 flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined !text-16px">forward</span>
        <span>Forward</span>
      </button>
    </div>
  </div>

  <!-- MOBILE COMPOSE MODAL -->
  <div id="composeModal" class="hidden fixed inset-0 bg-white z-50 flex flex-col">
    <div class="h-14 flex items-center justify-between px-3 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <button type="button" onclick="closeComposeModal()" class="p-1 text-gray-600">
          <span class="material-symbols-outlined">close</span>
        </button>
        <span class="font-medium text-base text-gray-800">Compose</span>
      </div>
      <div class="flex items-center gap-2">
        <!-- Paperclip attachment button -->
        <label for="composeFileInput" class="p-2 text-gray-600 cursor-pointer active:bg-gray-100 rounded-full" title="Attach Document/PDF">
          <span class="material-symbols-outlined">attach_file</span>
        </label>
        <input type="file" id="composeFileInput" class="hidden" accept="image/*,.pdf,.doc,.docx" onchange="handleFileSelected(event)" />
        
        <button type="submit" form="composeForm" class="text-blue-600 p-2">
          <span class="material-symbols-outlined !text-24px">send</span>
        </button>
      </div>
    </div>

    <form id="composeForm" onsubmit="handleSendMail(event)" class="flex-1 flex flex-col p-4 gap-3 overflow-y-auto">
      <div class="flex items-center border-b border-gray-200 pb-2">
        <span class="text-xs text-gray-500 w-16">From:</span>
        <input id="inputSender" type="text" placeholder="Sender Name (e.g. Ritika Verma)" class="flex-1 text-sm outline-none" required />
      </div>
      <div class="flex items-center border-b border-gray-200 pb-2">
        <span class="text-xs text-gray-500 w-16">Email:</span>
        <input id="inputEmail" type="email" placeholder="hr@technova.com" class="flex-1 text-sm outline-none" required />
      </div>
      <div class="flex items-center border-b border-gray-200 pb-2">
        <span class="text-xs text-gray-500 w-16">Subject:</span>
        <input id="inputSubject" type="text" placeholder="Subject" class="flex-1 text-sm outline-none" required />
      </div>
      <div class="flex items-center border-b border-gray-200 pb-2">
        <span class="text-xs text-gray-500 w-16">Folder:</span>
        <select id="inputFolder" class="flex-1 text-sm outline-none bg-transparent">
          <option value="inbox">Inbox</option>
          <option value="sent">Sent</option>
        </select>
      </div>
      <div class="flex items-center border-b border-gray-200 pb-2">
        <span class="text-xs text-gray-500 w-16">Date:</span>
        <input id="inputDate" type="date" class="flex-1 text-sm outline-none bg-transparent" />
      </div>

      <!-- Upload Custom Sender Avatar/Logo -->
      <div class="flex items-center justify-between py-1 border-b border-gray-200 text-xs">
        <span class="text-gray-600 font-medium">Sender Avatar / Logo:</span>
        <label for="senderLogoInput" class="px-2.5 py-1 bg-gray-100 hover:bg-gray-200 rounded border border-gray-300 cursor-pointer text-gray-700 flex items-center gap-1">
          <span class="material-symbols-outlined !text-14px">image</span>
          <span id="senderLogoLabel">Choose Image</span>
        </label>
        <input type="file" id="senderLogoInput" class="hidden" accept="image/*" onchange="handleSenderLogoUpload(event)" />
      </div>

      <!-- Upload Signature / Inline Logo (Like TechNova) -->
      <div class="flex items-center justify-between py-1 border-b border-gray-200 text-xs">
        <span class="text-gray-600 font-medium">Signature Banner / Logo:</span>
        <label for="signatureImageInput" class="px-2.5 py-1 bg-gray-100 hover:bg-gray-200 rounded border border-gray-300 cursor-pointer text-gray-700 flex items-center gap-1">
          <span class="material-symbols-outlined !text-14px">photo_camera</span>
          <span id="signatureLogoLabel">Choose Logo</span>
        </label>
        <input type="file" id="signatureImageInput" class="hidden" accept="image/*" onchange="handleSignatureUpload(event)" />
      </div>

      <!-- Attachment tray -->
      <div id="composeAttachmentPreview" class="hidden flex flex-wrap gap-2 py-1"></div>

      <textarea id="inputBody" placeholder="Compose email..." class="flex-1 resize-none text-sm outline-none pt-2" required></textarea>
    </form>
  </div>

  <script>
    const avatarPalette = ['#1a73e8', '#d93025', '#1e8e3e', '#f9ab00', '#9334e6', '#e37400', '#007b83', '#5f6368'];
    function getAvatarColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return avatarPalette[Math.abs(hash) % avatarPalette.length];
    }

    // SVG Data URL for TechNova branding
    const technovaLogoDataUri = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='70' viewBox='0 0 240 70'><rect width='240' height='70' fill='white'/><path d='M15 15 H50 V25 H37 V55 H27 V25 H15 Z' fill='%23002b80'/><circle cx='46' cy='18' r='5' fill='%23007acc'/><text x='58' y='42' font-family='Arial, sans-serif' font-weight='bold' font-size='26' fill='%23002060'>TechNova</text><text x='60' y='57' font-family='Arial, sans-serif' font-size='10' fill='%23555555' letter-spacing='2'>Innovate • Build • Grow</text></svg>";

    const sampleAttachments = [
      { name: "Offer_Letter_TechNova_2026.pdf", type: "pdf", size: "1.2 MB", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" },
      { name: "EndSem_Datesheet_April_2026.pdf", type: "pdf", size: "840 KB", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" },
      { name: "Campus_Hackathon_Schedule.pdf", type: "pdf", size: "2.1 MB", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" },
      { name: "System_Architecture_Schema.png", type: "image", size: "1.8 MB", url: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format&fit=crop&q=80" }
    ];

    function generateDatasetFromApril() {
      const senders = [
        { name: "Dean Academic Affairs", email: "academics@college.edu" },
        { name: "Training & Placement Cell", email: "tnp@college.edu" },
        { name: "Google Security Team", email: "no-reply@accounts.google.com" },
        { name: "GitHub Notifications", email: "notifications@github.com" },
        { name: "LeetCode Daily Challenge", email: "daily@leetcode.com" },
        { name: "HOD Computer Science", email: "hod_cse@college.edu" },
        { name: "Summer Internship Portal", email: "internships@college.edu" },
        { name: "Amazon Web Services", email: "billing@amazon.com" },
        { name: "LinkedIn Job Alerts", email: "jobalerts@linkedin.com" },
        { name: "Spotify Premium", email: "offers@spotify.com" },
        { name: "Zomato Delivery", email: "orders@zomato.com" },
        { name: "GeeksforGeeks Contests", email: "contests@geeksforgeeks.org" }
      ];

      const subjects = [
        "Schedule for End-Semester Examinations & Vivas",
        "Approval of Summer Internship NOC and Offer Letter",
        "Registration Open: Annual Inter-College Hackathon 2026",
        "Shortlisted Candidates for Technical Assessment Round 1",
        "Security Alert: New login detected on Linux browser",
        "[PR #84] Fix state mutation and memory leak merged into main",
        "Daily Challenge: Longest Substring Without Repeating Characters",
        "AWS Free Tier Alert: 85% of monthly limit reached",
        "5 new Software Engineer Intern openings match your profile",
        "Order Delivered: Enjoy your meal",
        "Developer Round-up: Mastering Memory Layout in C++"
      ];

      const bodies = [
        "Dear Students,\nPlease note that the datesheet for the examinations has been published on the board. Clear all pending approvals before hall ticket distribution.",
        "Your summer internship training application and verified documentation have been approved. You are permitted to commence on schedule.",
        "Teams can now confirm participation for the upcoming hackathon. Mentor allocations will be issued in the auditorium.",
        "Attached is the technical assessment schedule. Bring your college ID card and verify your workstation prior to test initiation.",
        "A new sign-in was detected on your account. If this was you, no action is needed."
      ];

      const list = [];
      const aprilFirst = new Date("2026-04-01T09:00:00").getTime();
      const currentNow = Date.now();
      const totalSpan = currentNow - aprilFirst;

      // Seed 1: The exact TechNova email with logo and corporate signature
      list.push({
        id: 1,
        sender: "Ritika Verma",
        email: "hr@technova.com",
        subject: "Offer Letter & Welcome to TechNova Solutions",
        body: "Dear Candidate,\n\nWe are pleased to offer you the position of Software Development Intern at TechNova Solutions Pvt. Ltd.\n\nYour internship commencement date is scheduled for next Monday. Please review the attached formal offer letter and return a signed acknowledgment copy.\n\nBest regards,\n\nRitika Verma\nHuman Resources Executive\nTechNova Solutions Pvt. Ltd.\nhr@technova.com\n+91 98765 43210",
        timestamp: currentNow - 3600000,
        folder: "inbox",
        starred: true,
        unread: true,
        logo: technovaLogoDataUri,
        signatureImage: technovaLogoDataUri,
        attachments: [sampleAttachments[0]]
      });

      for (let i = 2; i <= 200; i++) {
        const sender = senders[i % senders.length];
        const subject = subjects[(i * 3) % subjects.length];
        const body = bodies[(i * 5) % bodies.length];

        const ratio = (i - 1) / 199;
        const timestamp = currentNow - (ratio * totalSpan) - Math.floor(Math.random() * 14400000);

        let folder = "inbox";
        if (i % 14 === 0) folder = "trash";
        else if (i % 7 === 0) folder = "sent";

        const attachments = [];
        if (i % 3 === 0) attachments.push(sampleAttachments[i % sampleAttachments.length]);

        list.push({
          id: i,
          sender: folder === "sent" ? "To: " + sender.name : sender.name,
          email: sender.email,
          subject,
          body,
          timestamp,
          folder,
          starred: i % 8 === 0 && folder !== "trash",
          unread: i <= 14 && folder === "inbox",
          logo: null,
          signatureImage: null,
          attachments
        });
      }

      return list;
    }

    let emails = [];
    try {
      const saved = localStorage.getItem("gmail_mobile_custom_logos_2026");
      emails = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(emails) || emails.length < 50) {
        emails = generateDatasetFromApril();
        localStorage.setItem("gmail_mobile_custom_logos_2026", JSON.stringify(emails));
      }
    } catch (e) {
      emails = generateDatasetFromApril();
    }

    let activeFolder = "inbox";
    let activeEmailId = null;
    let composeAttachments = [];
    let customSenderLogo = null;
    let customSignatureLogo = null;

    function saveState() {
      emails.sort((a, b) => b.timestamp - a.timestamp);
      localStorage.setItem("gmail_mobile_custom_logos_2026", JSON.stringify(emails));
      render();
    }

    function regenerateAprilDataset() {
      emails = generateDatasetFromApril();
      activeFolder = "inbox";
      saveState();
      toggleDrawer(false);
      alert("Reloaded dataset with custom logos and signatures!");
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function render() {
      const listView = document.getElementById("emailListView");
      const emptyView = document.getElementById("emptyView");
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = emails.filter(m => {
        let matchesFolder = false;
        if (activeFolder === "inbox") matchesFolder = m.folder === "inbox";
        else if (activeFolder === "starred") matchesFolder = m.starred && m.folder !== "trash";
        else if (activeFolder === "sent") matchesFolder = m.folder === "sent";
        else if (activeFolder === "trash") matchesFolder = m.folder === "trash";

        if (!matchesFolder) return false;
        if (!query) return true;
        return m.sender.toLowerCase().includes(query) || 
               m.subject.toLowerCase().includes(query) || 
               m.body.toLowerCase().includes(query);
      });

      const unreadTotal = emails.filter(m => m.folder === "inbox" && m.unread).length;
      document.getElementById("mailCountBadge").textContent = `${filtered.length} emails`;
      document.getElementById("drawerUnread").textContent = unreadTotal;
      document.getElementById("folderTitleDisplay").textContent = activeFolder;

      const starTotal = emails.filter(m => m.starred && m.folder !== "trash").length;
      document.getElementById("drawerStarred").textContent = starTotal > 0 ? starTotal : "";

      listView.innerHTML = "";
      if (filtered.length === 0) {
        emptyView.classList.remove("hidden");
        listView.classList.add("hidden");
        return;
      }

      emptyView.classList.add("hidden");
      listView.classList.remove("hidden");

      filtered.forEach(mail => {
        const item = document.createElement("div");
        item.className = `flex items-start px-4 py-3 gap-3 active:bg-gray-100 transition-colors cursor-pointer ${mail.unread ? 'bg-white' : 'bg-[#f6f8fc]/40'}`;
        
        const cleanSenderName = mail.sender.replace("To: ", "");
        const avatarColor = getAvatarColor(cleanSenderName);

        // Custom logo or default letter avatar
        let avatarMarkup = "";
        if (mail.logo) {
          avatarMarkup = `
            <div class="w-9 h-9 rounded-full overflow-hidden bg-white border border-gray-200 shrink-0 flex items-center justify-center p-0.5">
              <img src="${mail.logo}" class="w-full h-full object-contain" alt="Logo" />
            </div>
          `;
        } else {
          avatarMarkup = `
            <div class="w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-sm shrink-0" style="background-color: ${avatarColor}">
              ${cleanSenderName.charAt(0).toUpperCase()}
            </div>
          `;
        }

        let attachmentChipsHTML = "";
        if (mail.attachments && mail.attachments.length > 0) {
          attachmentChipsHTML = `
            <div class="flex flex-wrap gap-1.5 mt-2">
              ${mail.attachments.map(att => `
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-gray-300 bg-white text-[11px] font-medium text-gray-700 shadow-xs">
                  <span class="material-symbols-outlined !text-14px ${att.type === 'pdf' ? '!text-red-500' : '!text-blue-500'}">
                    ${att.type === 'pdf' ? 'picture_as_pdf' : 'image'}
                  </span>
                  <span class="truncate max-w-[140px]">${att.name}</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        item.innerHTML = `
          ${avatarMarkup}
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline justify-between mb-0.5">
              <span class="text-sm ${mail.unread ? 'font-bold text-gray-900' : 'font-medium text-gray-700'} truncate pr-2">
                ${mail.sender}
              </span>
              <span class="text-xs ${mail.unread ? 'font-bold text-blue-600' : 'text-gray-500'} whitespace-nowrap">
                ${formatDate(mail.timestamp)}
              </span>
            </div>
            <div class="text-xs ${mail.unread ? 'font-bold text-gray-900' : 'text-gray-800'} truncate mb-0.5">
              ${mail.subject}
            </div>
            <div class="text-xs text-gray-500 truncate">
              ${mail.body.replace(/\n/g, ' ')}
            </div>
            ${attachmentChipsHTML}
          </div>

          <button onclick="toggleStar(event, ${mail.id})" class="p-1 text-gray-400 self-center">
            <span class="material-symbols-outlined !text-20px ${mail.starred ? 'fill-icon !text-yellow-400' : ''}">star</span>
          </button>
        `;

        item.onclick = () => openEmail(mail.id);
        listView.appendChild(item);
      });
    }

    function toggleDrawer(open) {
      const drawer = document.getElementById("drawer");
      const overlay = document.getElementById("drawerOverlay");
      if (open) {
        overlay.classList.remove("hidden");
        drawer.classList.remove("-translate-x-full");
      } else {
        overlay.classList.add("hidden");
        drawer.classList.add("-translate-x-full");
      }
    }

    function switchFolderFromDrawer(folder) {
      ['inbox', 'starred', 'sent', 'trash'].forEach(f => {
        const el = document.getElementById(`drawer-${f}`);
        if (f === folder) {
          el.className = "flex items-center justify-between px-4 py-3 rounded-full bg-[#d3e3fd] text-[#001d35] font-bold cursor-pointer";
        } else {
          el.className = "flex items-center justify-between px-4 py-3 rounded-full hover:bg-gray-100 cursor-pointer text-gray-700 font-medium";
        }
      });

      activeFolder = folder;
      toggleDrawer(false);
      render();
    }

    function switchFolder(folder) {
      switchFolderFromDrawer(folder);
    }

    function toggleStar(e, id) {
      e.stopPropagation();
      const mail = emails.find(m => m.id === id);
      if (mail) {
        mail.starred = !mail.starred;
        saveState();
      }
    }

    function toggleActiveStar() {
      if (activeEmailId) {
        const mail = emails.find(m => m.id === activeEmailId);
        if (mail) {
          mail.starred = !mail.starred;
          document.getElementById("detailStarIcon").className = `material-symbols-outlined ${mail.starred ? 'fill-icon !text-yellow-400' : ''}`;
          saveState();
        }
      }
    }

    function openEmail(id) {
      const mail = emails.find(m => m.id === id);
      if (!mail) return;

      mail.unread = false;
      activeEmailId = mail.id;
      saveState();

      document.getElementById("detailSubject").textContent = mail.subject;
      document.getElementById("detailSender").textContent = mail.sender;
      document.getElementById("detailEmail").textContent = `<${mail.email}>`;
      document.getElementById("detailDate").textContent = new Date(mail.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      document.getElementById("detailBody").textContent = mail.body;

      // Detail Avatar (Custom logo or letter)
      const wrapper = document.getElementById("detailAvatarWrapper");
      if (mail.logo) {
        wrapper.innerHTML = `
          <div class="w-10 h-10 rounded-full overflow-hidden bg-white border border-gray-200 p-0.5 flex items-center justify-center">
            <img src="${mail.logo}" class="w-full h-full object-contain" alt="Logo" />
          </div>
        `;
      } else {
        const cleanName = mail.sender.replace("To: ", "");
        wrapper.innerHTML = `
          <div class="w-10 h-10 rounded-full text-white flex items-center justify-center font-bold text-sm shrink-0" style="background-color: ${getAvatarColor(cleanName)}">
            ${cleanName.charAt(0).toUpperCase()}
          </div>
        `;
      }

      // Inline signature image display
      const sigContainer = document.getElementById("detailSignatureContainer");
      const sigImg = document.getElementById("detailSignatureImage");
      if (mail.signatureImage) {
        sigContainer.classList.remove("hidden");
        sigImg.src = mail.signatureImage;
      } else {
        sigContainer.classList.add("hidden");
        sigImg.src = "";
      }

      // Attachments display
      const attachmentsContainer = document.getElementById("detailAttachmentsContainer");
      const attachmentsList = document.getElementById("detailAttachmentsList");
      
      if (mail.attachments && mail.attachments.length > 0) {
        attachmentsContainer.classList.remove("hidden");
        document.getElementById("attachmentHeadingCount").textContent = `${mail.attachments.length} Attachment${mail.attachments.length > 1 ? 's' : ''}`;
        
        attachmentsList.innerHTML = mail.attachments.map(att => `
          <div class="flex items-center justify-between p-3 border border-gray-200 rounded-xl bg-[#f8fafd] hover:bg-gray-100 transition-colors">
            <div class="flex items-center gap-3 overflow-hidden">
              <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${att.type === 'pdf' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'}">
                <span class="material-symbols-outlined">${att.type === 'pdf' ? 'picture_as_pdf' : 'image'}</span>
              </div>
              <div class="min-w-0">
                <div class="text-xs font-semibold text-gray-800 truncate">${att.name}</div>
                <div class="text-[11px] text-gray-500 uppercase">${att.type} • ${att.size}</div>
              </div>
            </div>
            <a href="${att.url}" target="_blank" download="${att.name}" class="p-2 text-gray-600 hover:text-blue-600" title="Download / Open">
              <span class="material-symbols-outlined">download</span>
            </a>
          </div>
        `).join('');
      } else {
        attachmentsContainer.classList.add("hidden");
        attachmentsList.innerHTML = "";
      }

      document.getElementById("detailStarIcon").className = `material-symbols-outlined ${mail.starred ? 'fill-icon !text-yellow-400' : ''}`;
      document.getElementById("emailDetailView").classList.remove("hidden");
    }

    function closeDetailView() {
      document.getElementById("emailDetailView").classList.add("hidden");
      activeEmailId = null;
    }

    function deleteActiveEmail() {
      if (activeEmailId) {
        const mail = emails.find(m => m.id === activeEmailId);
        if (mail) {
          mail.folder = "trash";
          saveState();
          closeDetailView();
        }
      }
    }

    function openComposeModal() {
      document.getElementById("inputDate").value = new Date().toISOString().slice(0, 10);
      composeAttachments = [];
      customSenderLogo = null;
      customSignatureLogo = null;
      document.getElementById("senderLogoLabel").textContent = "Choose Image";
      document.getElementById("signatureLogoLabel").textContent = "Choose Logo";
      renderComposeAttachments();
      document.getElementById("composeModal").classList.remove("hidden");
    }

    function closeComposeModal() {
      document.getElementById("composeForm").reset();
      composeAttachments = [];
      customSenderLogo = null;
      customSignatureLogo = null;
      document.getElementById("composeModal").classList.add("hidden");
    }

    // Handles Sender Avatar Upload
    function handleSenderLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        customSenderLogo = e.target.result;
        document.getElementById("senderLogoLabel").textContent = "✓ " + file.name.slice(0, 10);
      };
      reader.readAsDataURL(file);
    }

    // Handles Signature / Inline Image Upload
    function handleSignatureUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        customSignatureLogo = e.target.result;
        document.getElementById("signatureLogoLabel").textContent = "✓ " + file.name.slice(0, 10);
      };
      reader.readAsDataURL(file);
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const isPdf = file.type.includes("pdf") || file.name.endsWith(".pdf");
        composeAttachments.push({
          name: file.name,
          type: isPdf ? 'pdf' : 'image',
          size: `${(file.size / 1024).toFixed(1)} KB`,
          url: e.target.result
        });
        renderComposeAttachments();
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function removeComposeAttachment(index) {
      composeAttachments.splice(index, 1);
      renderComposeAttachments();
    }

    function renderComposeAttachments() {
      const tray = document.getElementById("composeAttachmentPreview");
      if (composeAttachments.length === 0) {
        tray.classList.add("hidden");
        tray.innerHTML = "";
        return;
      }
      tray.classList.remove("hidden");
      tray.innerHTML = composeAttachments.map((att, idx) => `
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-gray-100 border border-gray-300 text-xs text-gray-700">
          <span class="material-symbols-outlined !text-14px ${att.type === 'pdf' ? '!text-red-500' : '!text-blue-500'}">
            ${att.type === 'pdf' ? 'picture_as_pdf' : 'image'}
          </span>
          <span class="truncate max-w-[120px]">${att.name}</span>
          <button type="button" onclick="removeComposeAttachment(${idx})" class="material-symbols-outlined !text-14px text-gray-400 hover:text-black">close</button>
        </div>
      `).join('');
    }

    function handleSendMail(e) {
      e.preventDefault();

      const sender = document.getElementById("inputSender").value.trim();
      const email = document.getElementById("inputEmail").value.trim();
      const subject = document.getElementById("inputSubject").value.trim();
      const folder = document.getElementById("inputFolder").value;
      const dateVal = document.getElementById("inputDate").value;
      const body = document.getElementById("inputBody").value.trim();

      const timestamp = dateVal ? new Date(dateVal).getTime() + (Date.now() % 86400000) : Date.now();

      emails.push({
        id: Date.now(),
        sender: folder === "sent" ? "To: " + sender : sender,
        email,
        subject,
        body,
        folder,
        timestamp,
        starred: false,
        unread: true,
        logo: customSenderLogo,
        signatureImage: customSignatureLogo,
        attachments: [...composeAttachments]
      });

      saveState();
      closeComposeModal();
      if (activeFolder !== folder) switchFolder(folder);
    }

    function handleSearch() {
      render();
    }

    render();
  </script>
</body>
</html>
